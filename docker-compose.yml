services:
  ledger:
    image: postgres:16-alpine
    container_name: celesto-ledger
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_placeholder_password}
      POSTGRES_DB: ${POSTGRES_DB:-celesto_ledger}
    volumes:
      - ledger_data:/var/lib/postgresql/data
      - ./seeds:/docker-entrypoint-initdb.d:ro
    ports:
      - "${LEDGER_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-celesto_ledger}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celesto-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      API_PORT: 8080
      API_HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_placeholder_password}@ledger:5432/${POSTGRES_DB:-celesto_ledger}
    depends_on:
      ledger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ledger_data:
    name: celesto_ledger_data
